<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>AI Trading Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Tek koyu görünüm: siyah/antrasit/lacivert zemin, yeşil=kâr, kırmızı=zarar/risk */
:root{
  --bg:#06080c; --bg2:#0b0f17; --panel:#10151f; --panel2:#151c29; --line:#212a3b;
  --text:#e3e7ef; --dim:#8b94a7; --faint:#5b6478;
  --up:#22c55e; --up-bg:#0e2818; --down:#ef4444; --down-bg:#2a0f12; --warn:#f5a524; --warn-bg:#2a200e;
  --accent:#5b84ff;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --navh:58px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
body{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 12px)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.dim{color:var(--dim)}.faint{color:var(--faint)}
[hidden]{display:none!important}

/* Üst bar */
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:600 14px var(--mono);letter-spacing:.12em}
.brand b{color:var(--up)}
.pill{font:600 10px var(--mono);letter-spacing:.06em;padding:3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--up);border-color:#1d4a2d;background:var(--up-bg)}
.pill.bad{color:#fca5a5;border-color:#4a1d22;background:var(--down-bg)}
.pill.wait{color:var(--warn);border-color:#4a3a18;background:var(--warn-bg)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px -14px 0;padding:0 14px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;gap:5px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.chip.ok i{background:var(--up)}.chip.warn i{background:var(--warn)}.chip.crit i{background:var(--down)}
.chip span{color:var(--dim)}.chip em{font-style:normal;font-family:var(--mono)}

main{padding:12px 14px 0;max-width:980px;margin:0 auto}
.warns{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.w{font-size:12px;padding:8px 10px;border-radius:8px;border:1px solid}
.w.crit{color:#fca5a5;background:var(--down-bg);border-color:#4a1d22}
.w.warn{color:#f8c66a;background:var(--warn-bg);border-color:#4a3a18}
.w.info{color:var(--dim);background:var(--panel);border-color:var(--line)}

/* Kartlar */
.stack{display:grid;gap:12px}
@media(min-width:760px){.stack{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{margin:0 0 10px;font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font:600 9px var(--mono);letter-spacing:.06em;padding:2px 6px;border-radius:4px;color:var(--warn);background:var(--warn-bg);border:1px solid #4a3a18;text-transform:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.k{font-size:11px;color:var(--dim)}
.v{font:500 15px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.v.xl{font-size:24px}
.s{font-size:11px;color:var(--faint)}
.note{font-size:12px;color:var(--dim);margin:10px 0 0}
.note.warn{color:#f8c66a}
.src{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:10.5px;color:var(--faint);margin-top:8px}
.src .err{color:#fca5a5;flex-basis:100%}
.b{font:600 9.5px var(--mono);padding:1px 5px;border-radius:4px;letter-spacing:.04em}
.b.CANLI{color:var(--up);background:var(--up-bg)}.b.ESKI,.b.GECIKMELI{color:var(--warn);background:var(--warn-bg)}.b.YOK{color:#fca5a5;background:var(--down-bg)}
.hr{height:1px;background:var(--line);margin:12px 0}

/* Fiyat kutuları */
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.px{background:var(--panel2);border-radius:10px;padding:11px;min-width:0}
.px-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim)}
.px-v{font:500 19px var(--mono);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.px-c{font:500 12px var(--mono)}
.px-m{font:11px var(--mono);color:var(--dim);margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 8px}

.bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin:6px 0}
.bar>div{height:100%;background:var(--accent)}
.lsbar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--down);margin-top:4px}
.lsbar>div{background:var(--up)}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.row:last-child{border-bottom:0}
.row4{grid-template-columns:1fr auto auto auto}

/* Piyasa sekmesi */
.ctrls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select,button{font:14px var(--sans);color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ctrls input{flex:1 1 140px;min-width:0}
.ctrls select{flex:1 1 140px;min-width:0}
.seg{display:flex;gap:3px;background:var(--bg2);border-radius:8px;padding:3px}
.seg button{border:0;background:none;min-height:30px;padding:4px 10px;font:12px var(--mono);color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--text)}
.tbl{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{width:100%;border-collapse:collapse;font:12px var(--mono);font-variant-numeric:tabular-nums}
th{font:500 11px var(--sans);color:var(--dim);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}
tbody tr.sel{background:var(--panel2)}
.chart{width:100%;height:210px;display:block}

/* Ayarlar */
.field{display:grid;gap:4px}
.field label{font-size:12px;color:var(--dim)}
.field input{width:100%}
.form{display:grid;gap:12px}
.btn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--bg2);border-color:var(--line);color:var(--text);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 14px);background:var(--panel2);border:1px solid var(--line);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30}

.list a{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none}
.list a:last-child{border-bottom:0}
.list small{color:var(--faint);font:11px var(--mono)}
ul.plain{margin:6px 0 0;padding-left:18px;color:var(--text);font-size:13px}
.log{font:11.5px var(--mono);display:grid;gap:6px}
.log div{display:grid;grid-template-columns:auto 1fr;gap:8px}
.log .crit{color:#fca5a5}.log .warn{color:#f8c66a}

/* Sinyal */
.dir{font:600 11px var(--mono);padding:3px 8px;border-radius:5px;letter-spacing:.06em;text-transform:none}
.dir.long{color:var(--up);background:var(--up-bg)}.dir.short{color:var(--down);background:var(--down-bg)}
.sig.stale{opacity:.6}
.small-btn{min-height:34px;padding:5px 12px;font-size:12.5px}
.row .s{overflow-wrap:anywhere}
/* Alt menü */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,11,17,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--faint);font-size:10.5px}
.nav a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}
.nav a.on{color:var(--text)}
.nav a.on svg{stroke:var(--accent)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">AI<b>·</b>TERMINAL</div>
    <div style="display:flex;gap:6px">
      <span class="pill" id="modePill">ANALİZ</span>
      <span class="pill wait" id="livePill">BAĞLANIYOR</span>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div class="warns" id="warns"></div>

</main>

<nav class="nav" id="nav">
  <a href="#ozet" data-tab="ozet"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Özet</a>
  <a href="#piyasa" data-tab="piyasa"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Piyasa</a>

  <a href="#ayar" data-tab="ayar"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Risk</a>
  <a href="#daha" data-tab="daha"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Daha</a>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* =====================================================================
   AI Trading Terminal — v0.3.0 (Aşama 1–2, telefon sürümü)
   Sunucusuz: tarayıcı Binance'in herkese açık uç noktalarına doğrudan
   bağlanır. API anahtarı KULLANMAZ ve saklamaz.
   ===================================================================== */
const VERSION = "0.4.0 · Aşama 3 · telefon";
const EP = {
  fut: "https://fapi.binance.com",
  ws: "wss://fstream.binance.com/market",   // 2026-03-06 WS ayrımı: /public /market /private
  spot: "https://api.binance.com",
  cg: "https://api.coingecko.com",
};
const SRC = "Binance USDⓈ-M Futures";
const WATCH = ["BTCUSDT", "ETHUSDT"];
const WS_STREAMS = ["!ticker@arr", "!markPrice@arr@1s", "!forceOrder@arr"];

/* ---------- Ayarlar: yapılandırılabilir, ama güvenlik sınırları kapatılamaz ---------- */
const DEFAULTS = { startTry: 1000, targetTry: 1000000, riskPct: 0.5, dailyPct: 2, maxPos: 2, minQv: 20e6, coingecko: true, takerPct: 0.05, maxSpreadBps: 5, maxLev: 10, scoreMin: 60 };
const BOUNDS = { startTry: [1, 1e9], targetTry: [1, 1e12], riskPct: [0.1, 2], dailyPct: [0.5, 10], maxPos: [1, 5], minQv: [1e6, 1e10], takerPct: [0.01, 0.2], maxSpreadBps: [1, 20], maxLev: [1, 10], scoreMin: [50, 95] };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
function clampCfg(c) {
  const out = { ...DEFAULTS, ...c };
  for (const [k, [lo, hi]] of Object.entries(BOUNDS)) {
    const n = Number(out[k]);
    out[k] = Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : DEFAULTS[k];
  }
  out.maxPos = Math.round(out.maxPos);
  out.maxLev = LEVS_ALLOWED.filter(l => l <= out.maxLev).pop() || 1;
  out.coingecko = !!out.coingecko;
  return out;
}
const LEVS_ALLOWED = [1, 2, 3, 5, 10];
let CFG = clampCfg(store.get("cfg", {}));

/* ---------- Veri modeli ---------- */
const now = () => Date.now();
function Datum(source, maxAge) { return { source, maxAge, value: null, at: null, err: null }; }
const setD = (d, v, at) => { d.value = v; d.at = at || now(); d.err = null; };
const failD = (d, e) => { d.err = String(e && e.message || e).slice(0, 200); };
const stD = (d) => d.at == null ? "YOK" : (now() - d.at <= d.maxAge ? "CANLI" : "ESKI");

const S = {
  tickers: new Map(), marks: new Map(), liqs: [], contracts: null,
  ws: { connected: false, since: null, last: null, err: null, reconnects: 0 },
  rest: { ok: false, lat: null, lastOk: null, err: null, offset: null, backoffUntil: 0 },
  exch: Datum(`${SRC} · exchangeInfo`, 2 * 3600e3),
  oi: Object.fromEntries(WATCH.map(s => [s, Datum(`${SRC} · openInterestHist 5m`, 180e3)])),
  ls: Object.fromEntries(WATCH.map(s => [s, Datum(`${SRC} · long/short hesap oranı 5m`, 180e3)])),
  vol: Datum(`${SRC} · BTCUSDT 5m mumlar (hesaplanan)`, 180e3),
  usdttry: Datum("Binance Spot · USDTTRY", 60e3),
  dom: Datum("CoinGecko · /global", 15 * 60e3),
  log: store.get("log", []),
};

/* ---------- Sistem logu (cihazda son 150 olay) ---------- */
function addLog(level, text) {
  const last = S.log[0];
  if (last && last.text === text && now() - last.t < 60e3) return; // tekrarları bastır
  S.log.unshift({ t: now(), level, text });
  S.log = S.log.slice(0, 150);
  store.set("log", S.log);
}

/* ---------- Biçimlendirme (tr-TR) ---------- */
const nf = (a, b) => new Intl.NumberFormat("tr-TR", { minimumFractionDigits: a, maximumFractionDigits: b });
const NF = { 0: nf(0, 0), 1: nf(1, 1), 2: nf(2, 2), 4: nf(4, 4) };
const TRY = new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", maximumFractionDigits: 2 });
const CMP = new Intl.NumberFormat("tr-TR", { notation: "compact", maximumFractionDigits: 2 });
const nil = v => v === null || v === undefined || Number.isNaN(v);
const fTRY = v => nil(v) ? "—" : TRY.format(v);
const fUSDT = (v, d = 2) => nil(v) ? "—" : `${nf(d, d).format(v)} USDT`;
const fUSD = v => nil(v) ? "—" : `${CMP.format(v)} $`;
const fN = (v, d = 2) => nil(v) ? "—" : nf(d, d).format(v);
function fPx(v) { if (nil(v)) return "—"; const a = Math.abs(v); return nf(2, a >= 1000 ? 2 : a >= 1 ? 4 : a >= 0.01 ? 5 : 8).format(v); }
function fPct(v, d = 2, signed = true) { if (nil(v)) return "—"; const s = v > 0 && signed ? "+" : v < 0 ? "-" : ""; return `${s}%${nf(d, d).format(Math.abs(v))}`; }
const fFund = v => nil(v) ? "—" : fPct(v * 100, 4);
function fAgo(t) { if (nil(t)) return "hiç alınmadı"; const s = Math.max(0, Math.round((now() - t) / 1000)); return s < 60 ? `${s} sn önce` : s < 3600 ? `${Math.floor(s / 60)} dk önce` : s < 86400 ? `${Math.floor(s / 3600)} sa önce` : `${Math.floor(s / 86400)} gün önce`; }
const fTime = t => nil(t) ? "—" : new Date(t).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const tone = v => nil(v) || v === 0 ? "" : v > 0 ? "up" : "down";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- WebSocket akışı ---------- */
let wsObj = null, wsTimer = null, wsBackoff = 1000, wsWatch = null;
function wsConnect() {
  clearTimeout(wsTimer);
  if (wsObj) { try { wsObj.onclose = null; wsObj.close(); } catch {} }
  const url = `${EP.ws}/stream?streams=${WS_STREAMS.join("/")}`;
  let ws;
  try { ws = new WebSocket(url); } catch (e) { S.ws.err = String(e); return wsRetry(); }
  wsObj = ws;
  ws.onopen = () => {
    S.ws.connected = true; S.ws.since = now(); S.ws.err = null; wsBackoff = 1000;
    addLog("info", "Binance WebSocket bağlandı");
  };
  ws.onmessage = ev => {
    S.ws.last = now();
    try { handleWs(JSON.parse(ev.data)); } catch (e) { S.ws.err = "Mesaj okunamadı: " + e.message; }
  };
  ws.onerror = () => { S.ws.err = "Bağlantı hatası (ağ, VPN veya bölgesel erişim)"; };
  ws.onclose = ev => {
    if (S.ws.connected) addLog("crit", `Binance WebSocket koptu (kod ${ev.code})`);
    S.ws.connected = false;
    wsRetry();
  };
}
function wsRetry() {
  S.ws.reconnects++;
  if (document.hidden) return; // arka planda pil harcama; görünür olunca yeniden bağlanır
  wsTimer = setTimeout(wsConnect, wsBackoff);
  wsBackoff = Math.min(wsBackoff * 2, 60000);
}
function handleWs(msg) {
  const st = msg.stream || "", d = msg.data;
  if (!d) return;
  if (st === "!ticker@arr") {
    for (const t of d) S.tickers.set(t.s, { last: +t.c, open: +t.o, high: +t.h, low: +t.l, chg: +t.P, qv: +t.q, ts: +t.E });
  } else if (st.startsWith("!markPrice@arr")) {
    for (const m of d) S.marks.set(m.s, { mark: +m.p, funding: m.r === "" || m.r == null ? null : +m.r, next: m.T, ts: +m.E });
  } else if (st === "!forceOrder@arr") {
    for (const ev of (Array.isArray(d) ? d : [d])) {
      const o = ev.o || {};
      const price = +o.ap || +o.p || 0, qty = +o.z || +o.q || 0;
      // S=SELL → long pozisyon tasfiye edildi; S=BUY → short tasfiye edildi
      S.liqs.push({ sym: o.s, side: o.S === "SELL" ? "LONG" : "SHORT", price, qty, usd: price * qty, ts: +(o.T || ev.E || now()) });
    }
    const cut = now() - 3600e3;
    if (S.liqs.length > 4000 || (S.liqs[0] && S.liqs[0].ts < cut)) S.liqs = S.liqs.filter(l => l.ts >= cut);
  }
}

/* ---------- REST ---------- */
async function getJSON(base, path, params) {
  if (now() < S.rest.backoffUntil) throw new Error("Binance hız sınırı nedeniyle beklemede");
  const u = new URL(base + path);
  if (params) for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), 10000);
  let r;
  try { r = await fetch(u, { signal: ctl.signal, cache: "no-store" }); }
  catch (e) { throw new Error(e.name === "AbortError" ? "Zaman aşımı (10 sn)" : "Ağ hatası veya erişim engeli"); }
  finally { clearTimeout(to); }
  if (r.status === 418 || r.status === 429) {
    const ra = +(r.headers.get("Retry-After") || 60);
    S.rest.backoffUntil = now() + ra * 1000;
    throw new Error(`HTTP ${r.status}: hız sınırı, ${ra} sn bekleniyor`);
  }
  if (r.status === 403 || r.status === 451) throw new Error(`HTTP ${r.status}: bölgesel erişim kısıtı olabilir`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function pollTime() {
  const t0 = now();
  try {
    const d = await getJSON(EP.fut, "/fapi/v1/time");
    const t1 = now();
    if (!S.rest.ok) addLog("info", "Binance REST erişilebilir");
    Object.assign(S.rest, { ok: true, lat: t1 - t0, lastOk: t1, err: null, offset: d.serverTime - Math.round((t0 + t1) / 2) });
  } catch (e) {
    if (S.rest.ok || S.rest.err == null) addLog("crit", "Binance REST hatası: " + e.message);
    S.rest.ok = false; S.rest.err = e.message;
  }
}
async function pollUsdtTry() {
  try { const d = await getJSON(EP.spot, "/api/v3/ticker/price", { symbol: "USDTTRY" }); setD(S.usdttry, +d.price); }
  catch (e) { failD(S.usdttry, e); }
}
async function pollOI(sym) {
  try {
    const rows = await getJSON(EP.fut, "/futures/data/openInterestHist", { symbol: sym, period: "5m", limit: 13 });
    const a = +rows[0].sumOpenInterestValue, b = +rows[rows.length - 1].sumOpenInterestValue;
    setD(S.oi[sym], { valueUsdt: b, chgPct: a ? (b - a) / a * 100 : null, windowMin: (rows.length - 1) * 5 }, +rows[rows.length - 1].timestamp);
  } catch (e) { failD(S.oi[sym], e); }
}
async function pollLS(sym) {
  try {
    const r = (await getJSON(EP.fut, "/futures/data/globalLongShortAccountRatio", { symbol: sym, period: "5m", limit: 1 })).pop();
    setD(S.ls[sym], { ratio: +r.longShortRatio, longPct: +r.longAccount * 100, shortPct: +r.shortAccount * 100 }, +r.timestamp);
  } catch (e) { failD(S.ls[sym], e); }
}
function computeVol(kl) {
  // Son (kapanmamış) mum dışarıda bırakılır → geleceğe sızma yok.
  const c = kl.slice(0, -1).map(k => +k[4]);
  if (c.length < 20) throw new Error("Yetersiz mum");
  const r = []; for (let i = 1; i < c.length; i++) r.push(Math.log(c[i] / c[i - 1]));
  const sd = a => { const m = a.reduce((x, y) => x + y, 0) / a.length; return Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / a.length); };
  const k = Math.sqrt(288);
  const v24 = sd(r) * k * 100, v1 = sd(r.slice(-12)) * k * 100, ratio = v24 ? v1 / v24 : null;
  const regime = ratio == null ? "Belirsiz" : ratio > 1.5 ? "Artıyor" : ratio < 0.67 ? "Sakinleşiyor" : "Normal";
  return { v24, v1, ratio, regime, candles: c.length };
}
async function pollVol() {
  try { setD(S.vol, computeVol(await getJSON(EP.fut, "/fapi/v1/klines", { symbol: "BTCUSDT", interval: "5m", limit: 289 }))); }
  catch (e) { failD(S.vol, e); }
}
async function pollExch() {
  try {
    const d = await getJSON(EP.fut, "/fapi/v1/exchangeInfo");
    const m = new Map();
    for (const s of d.symbols || []) {
      if (s.contractType !== "PERPETUAL" || s.quoteAsset !== "USDT" || s.status !== "TRADING") continue;
      const f = Object.fromEntries((s.filters || []).map(x => [x.filterType, x]));
      m.set(s.symbol, { tick: f.PRICE_FILTER?.tickSize, step: f.LOT_SIZE?.stepSize, minQty: f.LOT_SIZE?.minQty, minNotional: f.MIN_NOTIONAL?.notional });
    }
    S.contracts = m; setD(S.exch, m.size);
  } catch (e) { failD(S.exch, e); }
}
async function pollDom() {
  try {
    const d = (await getJSON(EP.cg, "/api/v3/global")).data;
    setD(S.dom, { btc: +d.market_cap_percentage.btc, eth: +(d.market_cap_percentage.eth || 0) }, d.updated_at ? d.updated_at * 1000 : null);

}

let tick = 0, restTimer = null;
async function restCycle() {
  clearTimeout(restTimer);
  if (document.hidden) return; // arka planda istek yapma
  const jobs = [pollTime(), pollUsdtTry()];
  if (tick % 4 === 0) jobs.push(pollVol(), ...WATCH.map(pollOI), ...WATCH.map(pollLS));
  if (tick % 240 === 0 || !S.contracts) jobs.push(pollExch());
  if (CFG.coingecko && tick % 20 === 0) jobs.push(pollDom());
  await Promise.allSettled(jobs);
  tick++;
  restTimer = setTimeout(restCycle, 15000);
}

function rows(minQv = 0) {
  const out = [];
  for (const [s, t] of S.tickers) {
    if (S.contracts ? !S.contracts.has(s) : !s.endsWith("USDT")) continue;
    if (t.qv < minQv) continue;
    const m = S.marks.get(s) || {};
    out.push({ s, last: t.last, chg: t.chg, qv: t.qv, rng: t.low ? (t.high - t.low) / t.low * 100 : null, funding: m.funding ?? null, ts: t.ts });
  }
  return out;
}
function dataState() {
  if (!S.ws.last) return "YOK";
  const a = now() - S.ws.last;
  return a <= 5000 ? "CANLI" : a <= 30000 ? "GECIKMELI" : "YOK";
}
function snapshot() {
  const all = rows();
  const qv = all.reduce((a, r) => a + r.qv, 0);
  let breadth = null, vw = null, dir = "Veri yok";
  if (all.length && qv > 0) {
    breadth = all.filter(r => r.chg > 0).length / all.length * 100;
    vw = all.reduce((a, r) => a + r.chg * r.qv, 0) / qv;
    dir = vw > 1 && breadth > 60 ? "Yükseliş ağırlıklı" : vw < -1 && breadth < 40 ? "Düşüş ağırlıklı" : "Karışık / yatay";
  }
  const liquid = all.filter(r => r.qv >= CFG.minQv);
  const fw = liquid.filter(r => r.funding != null);
  const fwq = fw.reduce((a, r) => a + r.qv, 0);
  const cut = now() - 3600e3;
  const recent = S.liqs.filter(l => l.ts >= cut);
  return {
    all, qv, breadth, vw, dir,
    gainers: [...liquid].sort((a, b) => b.chg - a.chg).slice(0, 5),
    losers: [...liquid].sort((a, b) => a.chg - b.chg).slice(0, 5),
    avgFunding: fwq ? fw.reduce((a, r) => a + r.funding * r.qv, 0) / fwq : null,
    liqLong: recent.filter(l => l.side === "LONG").reduce((a, l) => a + l.usd, 0),
    liqShort: recent.filter(l => l.side === "SHORT").reduce((a, l) => a + l.usd, 0),
    liqBig: [...recent].sort((a, b) => b.usd - a.usd).slice(0, 5),
    liqWin: S.ws.since ? Math.min(60, Math.floor((now() - S.ws.since) / 60e3)) : 0,
  };
}
function warnings() {
  const w = [];
  if (!navigator.onLine) w.push(["crit", "Telefonun internet bağlantısı yok."]);
  if (!S.ws.connected) w.push(["crit", `Binance canlı akışı bağlı değil: ${S.ws.err || "bağlanıyor…"}`]);

function chartHTML() {
  if (MK.cErr) return `<div class="s">Mum verisi alınamadı: ${esc(MK.cErr)}</div>`;
  const c = MK.candles;
  if (c.length < 2) return `<div class="s">${MK.loading ? "Yükleniyor…" : "Veri yok"}</div>`;
  const W = 400, H = 210, pr = 58, pt = 8, pb = 8;
  const hi = Math.max(...c.map(k => k.h)), lo = Math.min(...c.map(k => k.l));
  const y = p => pt + (hi - p) / (hi - lo || 1) * (H - pt - pb);
  const step = (W - pr) / c.length, bw = Math.max(1, step * .62);
  let g = "";
  for (const p of [hi, (hi + lo) / 2, lo]) g += `<line x1="0" x2="${W - pr}" y1="${y(p)}" y2="${y(p)}" stroke="#212a3b" stroke-dasharray="2 4"/><text x="${W - pr + 4}" y="${y(p) + 4}" fill="#5b6478" font-size="10" font-family="IBM Plex Mono,monospace">${fPx(p)}</text>`;
  c.forEach((k, i) => {
    const x = i * step + step / 2, col = k.c >= k.o ? "#22c55e" : "#ef4444", op = k.closed ? 1 : .45;
    g += `<g opacity="${op}"><line x1="${x}" x2="${x}" y1="${y(k.h)}" y2="${y(k.l)}" stroke="${col}"/><rect x="${x - bw / 2}" y="${y(Math.max(k.o, k.c))}" width="${bw}" height="${Math.max(1, Math.abs(y(k.o) - y(k.c)))}" fill="${col}"/></g>`;
  });
  const last = c[c.length - 1].c;
  g += `<line x1="0" x2="${W - pr}" y1="${y(last)}" y2="${y(last)}" stroke="#5b84ff" stroke-dasharray="3 3"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(MK.sel)} mum grafiği">${g}</svg>`;
}

  if (box) box.innerHTML = chartHTML();
  chartTimer = setTimeout(loadChart, 15000);
}

/* =====================================================================
   AŞAMA 3 — TEKNİK ANALİZ, TARAMA VE KARAR MOTORU
   Göstergeler yalnızca KAPANMIŞ mumlardan hesaplanır (geleceğe sızma yok).
   ===================================================================== */
const STRATEGY_VERSION = "trend-pullback v1.0";
const STOP_SLIP = 0.0005;   // stop çıkışında ek kayma payı (%0,05) — varsayım
const MMR_ASSUMED = 0.01;   // bakım teminatı oranı varsayımı (%1, temkinli) — gerçek değer kademeye göre değişir
const SIGNAL_TTL = 15 * 60e3;
const MAX_ANALYZE = 14;
const LEVS = [1, 2, 3, 5, 10];

const TA = {
  sma(a, n) { const o = Array(a.length).fill(null); let s = 0; for (let i = 0; i < a.length; i++) { s += a[i]; if (i >= n) s -= a[i - n]; if (i >= n - 1) o[i] = s / n; } return o; },
  ema(a, n) { const o = Array(a.length).fill(null); if (a.length < n) return o; const k = 2 / (n + 1); let e = 0; for (let i = 0; i < n; i++) e += a[i]; e /= n; o[n - 1] = e; for (let i = n; i < a.length; i++) { e = a[i] * k + e * (1 - k); o[i] = e; } return o; },
  wilder(a, n) { const o = Array(a.length).fill(null); if (a.length < n) return o; let v = 0; for (let i = 0; i < n; i++) v += a[i]; v /= n; o[n - 1] = v; for (let i = n; i < a.length; i++) { v = (v * (n - 1) + a[i]) / n; o[i] = v; } return o; },
  rsi(c, n = 14) {
    const o = Array(c.length).fill(null); if (c.length <= n) return o;
    let g = 0, l = 0; for (let i = 1; i <= n; i++) { const d = c[i] - c[i - 1]; if (d > 0) g += d; else l -= d; }
    g /= n; l /= n; o[n] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    for (let i = n + 1; i < c.length; i++) { const d = c[i] - c[i - 1]; g = (g * (n - 1) + Math.max(d, 0)) / n; l = (l * (n - 1) + Math.max(-d, 0)) / n; o[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l); }
    return o;
  },
  macd(c, f = 12, s = 26, sg = 9) {
    const ef = TA.ema(c, f), es = TA.ema(c, s);
    const m = c.map((_, i) => ef[i] != null && es[i] != null ? ef[i] - es[i] : null);
    const st = m.findIndex(v => v != null), sig = Array(c.length).fill(null);
    if (st >= 0) TA.ema(m.slice(st), sg).forEach((v, j) => sig[st + j] = v);
    return { m, sig, h: m.map((v, i) => v != null && sig[i] != null ? v - sig[i] : null) };
  },
  tr(h, l, c) { return h.map((_, i) => i === 0 ? h[0] - l[0] : Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1]))); },
  atr(h, l, c, n = 14) { return TA.wilder(TA.tr(h, l, c), n); },
  bb(c, n = 20, k = 2) {
    const m = TA.sma(c, n), up = [], lo = [];
    for (let i = 0; i < c.length; i++) { if (m[i] == null) { up.push(null); lo.push(null); continue; } let s = 0; for (let j = i - n + 1; j <= i; j++) s += (c[j] - m[i]) ** 2; const sd = Math.sqrt(s / n); up.push(m[i] + k * sd); lo.push(m[i] - k * sd); }
    return { m, up, lo };
  },
  adx(h, l, c, n = 14) {
    const pdm = [], ndm = [];
    for (let i = 1; i < c.length; i++) { const u = h[i] - h[i - 1], d = l[i - 1] - l[i]; pdm.push(u > d && u > 0 ? u : 0); ndm.push(d > u && d > 0 ? d : 0); }
    const tr = TA.tr(h, l, c).slice(1), sT = TA.wilder(tr, n), sP = TA.wilder(pdm, n), sN = TA.wilder(ndm, n);
    const pdi = [], ndi = [], dx = [];
    for (let j = 0; j < tr.length; j++) {
      if (sT[j] == null || sT[j] === 0) { pdi.push(null); ndi.push(null); dx.push(null); continue; }
      const p = 100 * sP[j] / sT[j], q = 100 * sN[j] / sT[j];
      pdi.push(p); ndi.push(q); dx.push(p + q === 0 ? 0 : 100 * Math.abs(p - q) / (p + q));
    }
    const f = dx.findIndex(v => v != null), ad = Array(dx.length).fill(null);
    if (f >= 0) TA.wilder(dx.slice(f), n).forEach((v, k) => ad[f + k] = v);
    return { adx: [null, ...ad], pdi: [null, ...pdi], ndi: [null, ...ndi] };
  },
  vwap(k) {
    if (!k.length) return { value: null, note: "" };
    const day = Math.floor(k[k.length - 1].t / 864e5) * 864e5;
    let s = k.filter(x => x.t >= day), note = "UTC gün başından";
    if (s.length < 6) { s = k.slice(-12); note = "son 1 saat (gün yeni başladı)"; }
    let pv = 0, v = 0; for (const x of s) { pv += (x.h + x.l + x.c) / 3 * x.v; v += x.v; }
    return { value: v ? pv / v : null, note };
  },
  pivots(k, w = 3) {
    const hi = [], lo = [];
    for (let i = w; i < k.length - w; i++) {
      let H = true, L = true;
      for (let j = 1; j <= w; j++) { if (k[i].h <= k[i - j].h || k[i].h <= k[i + j].h) H = false; if (k[i].l >= k[i - j].l || k[i].l >= k[i + j].l) L = false; }
      if (H) hi.push(k[i].h); if (L) lo.push(k[i].l);
    }
    return { hi, lo };
  },
};
window.TA = TA; // test erişimi için

const last = a => { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; };
const prevv = a => { let seen = 0; for (let i = a.length - 1; i >= 0; i--) if (a[i] != null && ++seen === 2) return a[i]; return null; };
const decOf = s => ((String(s).split(".")[1] || "").replace(/0+$/, "")).length;
const floorStep = (x, step) => { const st = +step; if (!st) return x; return +(Math.floor(x / st + 1e-9) * st).toFixed(decOf(step)); };
const roundTick = (x, tick, mode) => { const t = +tick; if (!t) return x; const f = mode === "down" ? Math.floor : mode === "up" ? Math.ceil : Math.round; return +(f(x / t + (mode === "down" ? 1e-9 : mode === "up" ? -1e-9 : 0)) * t).toFixed(decOf(tick)); };

async function klines(sym, iv, limit) {
  const d = await getJSON(EP.fut, "/fapi/v1/klines", { symbol: sym, interval: iv, limit });
  // Son mum kapanmamıştır → çıkarılır.
  return d.slice(0, -1).map(k => ({ t: k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], v: +k[5] }));
}

function tfFeatures(k) {
  const c = k.map(x => x.c), h = k.map(x => x.h), l = k.map(x => x.l), v = k.map(x => x.v);
  const md = TA.macd(c), ad = TA.adx(h, l, c), b = TA.bb(c);
  const vavg = TA.sma(v, 20);
  return {
    n: k.length, close: c[c.length - 1],
    e9: last(TA.ema(c, 9)), e20: last(TA.ema(c, 20)), e50: last(TA.ema(c, 50)), e200: last(TA.ema(c, 200)),
    rsi: last(TA.rsi(c)), macdH: last(md.h), macdHp: prevv(md.h), atr: last(TA.atr(h, l, c)),
    adx: last(ad.adx), pdi: last(ad.pdi), ndi: last(ad.ndi),
    bbUp: last(b.up), bbLo: last(b.lo), bbMid: last(b.m),
    volRatio: vavg[vavg.length - 2] ? v[v.length - 1] / vavg[vavg.length - 2] : null,
  };
}

function structure15(k, atr, dir) {
  // Kırılım: son 6 kapanmış mum içinde, önceki 20 mumun tepesini (LONG) / dibini (SHORT) kapanışla aşan mum.
  const n = k.length; let br = null;
  for (let j = n - 6; j < n; j++) {
    if (j < 21) continue;
    const prior = k.slice(j - 20, j);
    const lvl = dir > 0 ? Math.max(...prior.map(x => x.h)) : Math.min(...prior.map(x => x.l));
    if (dir > 0 ? k[j].c > lvl : k[j].c < lvl) {
      const vavg = prior.reduce((a, x) => a + x.v, 0) / 20;
      br = { j, lvl, weakVol: k[j].v < 1.2 * vavg };
    }
  }
  let retest = false, failed = false;
  if (br) {
    const after = k.slice(br.j + 1), lc = k[n - 1].c;
    retest = after.some(x => dir > 0 ? x.l <= br.lvl + 0.3 * atr : x.h >= br.lvl - 0.3 * atr) && (dir > 0 ? lc > br.lvl : lc < br.lvl);
    failed = dir > 0 ? lc < br.lvl : lc > br.lvl;
  }
  const a = k[n - 2], b = k[n - 1], body = Math.abs(b.c - b.o), up = b.h - Math.max(b.o, b.c), lw = Math.min(b.o, b.c) - b.l;
  let pattern = null;
  if (dir > 0 && a.c < a.o && b.c > b.o && b.o <= a.c && b.c >= a.o) pattern = "Yutan boğa mumu";
  else if (dir < 0 && a.c > a.o && b.c < b.o && b.o >= a.c && b.c <= a.o) pattern = "Yutan ayı mumu";
  else if (dir > 0 && body > 0 && lw >= 2 * body && up <= body) pattern = "Çekiç";
  else if (dir < 0 && body > 0 && up >= 2 * body && lw <= body) pattern = "Kayan yıldız";
  const pv = TA.pivots(k.slice(-100));
  return { br, retest, failed, pattern, pv };
}

/* --- Tarama durumu --- */
const AN = { running: false, at: null, nextAt: null, results: [], pre: { scanned: 0, eliminated: [], skipped: 0 }, err: null, open: new Set(), seen: new Map(), showRules: false };

function prefilter(book) {
  const out = { ok: [], elim: [] };
  for (const r of rows(CFG.minQv)) {
    const b = book.get(r.s);
    if (!b) { out.elim.push([r.s, "Alış-satış fiyatı yok"]); continue; }
    const mid = (b.bid + b.ask) / 2, sp = (b.ask - b.bid) / mid * 1e4;
    r.bid = b.bid; r.ask = b.ask; r.spreadBps = sp;
    if (sp > CFG.maxSpreadBps) { out.elim.push([r.s, `Spread geniş (${fN(sp, 1)} bp)`]); continue; }
    if (Math.abs(r.chg) > 25) { out.elim.push([r.s, `Aşırı 24s hareket (${fPct(r.chg, 1)})`]); continue; }
    if (r.rng != null && r.rng > 40) { out.elim.push([r.s, `Sağlıksız 24s aralık (${fPct(r.rng, 0, false)})`]); continue; }
    out.ok.push(r);
  }
  out.ok.sort((a, b) => b.qv - a.qv);
  return out;
}

async function analyzeSymbol(r) {
  const [k1, k5, k15, k60] = await Promise.all([klines(r.s, "1m", 61), klines(r.s, "5m", 300), klines(r.s, "15m", 250), klines(r.s, "1h", 250)]);
  const at = now();
  const H = tfFeatures(k60), M = tfFeatures(k15), F = tfFeatures(k5), O = tfFeatures(k1);
  const vw = TA.vwap(k5);
  const t = S.tickers.get(r.s), mk = S.marks.get(r.s) || {};
  const price = t && now() - t.ts < 10e3 ? t.last : F.close;
  const res = { sym: r.s, at, price, spreadBps: r.spreadBps, H, M, F, O, vwap: vw, gates: [], soft: [], contra: [], plan: null, decision: "İŞLEM YOK", side: null, score: 0, reason: "" };

  // Rejim (1 saat)
  const enough = H.e50 != null && M.e50 != null && F.e9 != null && H.adx != null && M.atr != null && F.atr != null && O.atr != null;
  let regime = "Yetersiz veri";
  if (enough) {
    if (H.e20 > H.e50 && H.close > H.e50 && H.adx >= 20) regime = "Yükselen trend";
    else if (H.e20 < H.e50 && H.close < H.e50 && H.adx >= 20) regime = "Düşen trend";
    else regime = H.adx < 20 ? "Yatay / zayıf trend" : "Kararsız (EMA'lar karışık)";
  }
  res.regime = regime;
  const dir = regime === "Yükselen trend" ? 1 : regime === "Düşen trend" ? -1 : 0;
  res.side = dir > 0 ? "LONG" : dir < 0 ? "SHORT" : null;
  const G = (name, pass, detail) => res.gates.push({ name, pass: !!pass, detail });
  const gt = (a, b) => dir > 0 ? a > b : a < b;

  G("Veri tazeliği", enough && t && now() - t.ts < 10e3, enough ? `Fiyat ${t ? fAgo(t.ts) : "yok"}` : "Göstergeler için yeterli mum yok");
  G("Spread", r.spreadBps <= CFG.maxSpreadBps, `${fN(r.spreadBps, 1)} bp (sınır ${CFG.maxSpreadBps})`);
  G("1s trend rejimi", dir !== 0, `${regime} · EMA20 ${fPx(H.e20)} / EMA50 ${fPx(H.e50)} · ADX ${fN(H.adx, 0)}`);
  if (dir === 0) return finish(res, "1 saatlik grafikte net trend yok; bu sürümde yalnızca trend yönünde işlem stratejisi var.");

  G("15dk yapı", gt(M.close, M.e50) && gt(M.e20, M.e50), `Kapanış ${fPx(M.close)} · EMA20 ${fPx(M.e20)} · EMA50 ${fPx(M.e50)}`);
  const spike = Math.max(...k1.slice(-3).map(x => x.h - x.l)) > 3 * O.atr;
  G("Ani hareket yok", !spike && Math.abs(r.chg) <= 25, spike ? "Son 3 dakikada ATR'nin 3 katından büyük mum" : "1dk mumlar normal");
  const ext = Math.abs(price - M.e20) / M.atr;
  const rsiOk = dir > 0 ? M.rsi < 72 : M.rsi > 28;
  G("Aşırı uzama yok", gt(price, M.e20) ? ext <= 1.5 && rsiOk : rsiOk, `EMA20'ye uzaklık ${fN(ext, 2)} ATR · RSI ${fN(M.rsi, 0)}`);
  G("5dk tetik", gt(F.close, F.e9) && vw.value != null && gt(F.close, vw.value), `Kapanış ${fPx(F.close)} · EMA9 ${fPx(F.e9)} · VWAP ${fPx(vw.value)}`);

  // Yumuşak puan (0–100) — ağırlıklar başlangıç varsayımıdır, Aşama 5'te geçmiş veriyle test edilecek.
  const st = structure15(k15, M.atr, dir);
  const P = (name, pts, got, detail) => { res.soft.push({ name, pts, got: !!got, detail }); if (got) res.score += pts; else res.contra.push(`${name}: ${detail}`); };
  P("15dk ADX ≥ 20", 15, M.adx >= 20, `ADX ${fN(M.adx, 0)}`);
  P("15dk MACD histogram yönü", 15, gt(M.macdH, 0), `${fN(M.macdH, 5)}`);
  P("MACD ivmesi artıyor", 10, M.macdHp != null && gt(M.macdH, M.macdHp), `${fN(M.macdHp, 5)} → ${fN(M.macdH, 5)}`);
  P("15dk RSI sağlıklı bölgede", 10, dir > 0 ? M.rsi >= 50 && M.rsi <= 65 : M.rsi <= 50 && M.rsi >= 35, `RSI ${fN(M.rsi, 0)}`);
  P("5dk hacim ortalamanın üstünde", 10, F.volRatio >= 1.2, `${fN(F.volRatio, 2)}× ortalama`);
  P("1s fiyat EMA200 doğru tarafında", 10, H.e200 != null && gt(H.close, H.e200), `EMA200 ${fPx(H.e200)}`);
  P("1s EMA9 / EMA20 uyumu", 10, gt(H.e9, H.e20), `${fPx(H.e9)} / ${fPx(H.e20)}`);
  P("Kırılım + geri test", 15, st.retest && !st.br?.weakVol, st.br ? `Seviye ${fPx(st.br.lvl)}${st.retest ? " · geri test tuttu" : " · geri test yok"}${st.br.weakVol ? " · kırılım hacmi zayıf" : ""}` : "Son 6 mumda kırılım yok");
  P("Destekleyen mum formasyonu", 5, !!st.pattern, st.pattern || "Yok");
  if (st.failed) res.contra.push("Son kırılım geri alındı (sahte kırılım riski)");
  if (dir > 0 && M.bbUp && price > M.bbUp) res.contra.push("Fiyat 15dk Bollinger üst bandının dışında");
  if (dir < 0 && M.bbLo && price < M.bbLo) res.contra.push("Fiyat 15dk Bollinger alt bandının dışında");

  const techFail = res.gates.find(g => !g.pass);
  if (techFail) return finish(res, `${techFail.name}: ${techFail.detail}`);

  // ---- Seviyeler, maliyet, boyut ----
  const c = S.contracts?.get(r.s) || {};
  const entry = dir > 0 ? r.ask : r.bid;
  const recent = k15.slice(-6);
  const structStop = dir > 0 ? Math.min(...recent.map(x => x.l)) - 0.2 * M.atr : Math.max(...recent.map(x => x.h)) + 0.2 * M.atr;
  const atrStop = entry - dir * 1.2 * M.atr;
  let stop = dir > 0 ? Math.min(structStop, atrStop) : Math.max(structStop, atrStop);
  stop = roundTick(stop, c.tick, dir > 0 ? "down" : "up");
  const R = Math.abs(entry - stop), stopPct = R / entry;
  const resLvl = dir > 0 ? st.pv.hi.filter(p => p > entry).sort((a, b) => a - b)[0] : st.pv.lo.filter(p => p < entry).sort((a, b) => b - a)[0];
  let tp1 = entry + dir * 1.5 * R, tp2 = entry + dir * 2.5 * R, tp2Capped = false;
  if (resLvl != null && Math.abs(resLvl - entry) < 2.5 * R) { tp2 = resLvl - dir * 0.1 * M.atr; tp2Capped = true; }
  // Hedef sırası her zaman giriş → TP1 → TP2 olmalı
  if (Math.abs(tp2 - entry) < Math.abs(tp1 - entry)) tp1 = entry + 0.6 * (tp2 - entry);
  tp1 = roundTick(tp1, c.tick); tp2 = roundTick(tp2, c.tick);

  const fee = CFG.takerPct / 100, halfSp = r.spreadBps / 2e4;
  const lossPerN = stopPct + 2 * fee + halfSp + STOP_SLIP;
  const u = S.usdttry.value;
  const equity = u ? CFG.startTry / u : null;
  const riskU = equity ? equity * CFG.riskPct / 100 : null;
  let qty = riskU ? floorStep(riskU / lossPerN / entry, c.step || "0.001") : 0;
  let notional = qty * entry;
  const minN = +(c.minNotional || 5), minQ = +(c.minQty || 0);
  let lev = null;
  if (equity) for (const L of LEVS) { if (L > CFG.maxLev) break; if (notional / L <= equity * 0.45) { lev = L; break; } }
  const liqDist = lev ? 1 / lev - MMR_ASSUMED : null;
  const fundRate = mk.funding ?? 0;
  const fundingDue = mk.next && mk.next - at < 2 * 3600e3;
  const fundCost = fundingDue ? notional * fundRate * dir : 0; // pozitif = gider
  const feeCost = notional * 2 * fee;
  const netLoss = notional * lossPerN + Math.max(0, fundCost);
  const net = tp => notional * Math.abs(tp - entry) / entry - feeCost - notional * halfSp - fundCost;
  const net1 = net(tp1), net2 = net(tp2);
  const rr2 = netLoss > 0 ? net2 / netLoss : 0;
  const costShare = (2 * fee + halfSp + STOP_SLIP) / lossPerN;

  res.plan = { entry, zoneLo: dir > 0 ? entry - 0.15 * F.atr : entry - 0.05 * F.atr, zoneHi: dir > 0 ? entry + 0.05 * F.atr : entry + 0.15 * F.atr,
    stop, stopPct, R, tp1, tp2, tp2Capped, resLvl, qty, notional, lev, margin: lev ? notional / lev : null, liqDist,
    feeCost, fundCost, fundingDue, fundRate, netLoss, net1, net2, rr2, riskU, equity, u, costShare, atr5: F.atr,
    validUntil: at + SIGNAL_TTL, minN, invalid: dir > 0 ? `15dk mum EMA50 (${fPx(M.e50)}) altında kapanırsa veya fiyat girişten önce stop seviyesine inerse` : `15dk mum EMA50 (${fPx(M.e50)}) üstünde kapanırsa veya fiyat girişten önce stop seviyesine çıkarsa` };

  G("Stop mesafesi", stopPct >= 0.003 && R <= 2.5 * M.atr, `%${fN(stopPct * 100, 2)} · ${fN(R / M.atr, 2)} ATR (alt sınır %0,30, üst 2,5 ATR)`);
  G("Maliyet / risk oranı", costShare <= 0.25, `Maliyetler zararın %${fN(costShare * 100, 0)}'i (sınır %25)`);
  G("Hedefe yer var", resLvl == null || Math.abs(resLvl - entry) >= 1.0 * R, resLvl == null ? "Yakında direnç yok" : `Yakın ${dir > 0 ? "direnç" : "destek"} ${fPx(resLvl)} (${fN(Math.abs(resLvl - entry) / R, 2)} R)`);
  G("USDT/TRY kuru", !!u, u ? `1 USDT = ${fN(u, 2)} TL` : "Kur yok, pozisyon hesaplanamaz");
  G("Asgari emir tutarı", qty > 0 && qty >= minQ && notional >= minN, `Risk sınırıyla açılabilen ${fUSDT(notional)} · Binance asgari ${fUSDT(minN)}`);
  G("Kaldıraç ve teminat", lev != null, lev ? `${lev}x · teminat ${fUSDT(notional / lev)}` : `${CFG.maxLev}x'e kadar teminat sınırına sığmıyor`);
  G("Tasfiye mesafesi", liqDist != null && stopPct <= 0.5 * liqDist, liqDist ? `Stop %${fN(stopPct * 100, 2)} · tahmini tasfiye ~%${fN(liqDist * 100, 1)} (bakım oranı %1 varsayıldı)` : "—");
  G("Funding yükü", !(fundingDue && fundRate * dir > 0.0005), fundingDue ? `Sonraki funding ${fFund(fundRate)} · ${fTime(mk.next)}` : "Geçerlilik süresinde funding yok");
  G("Net risk/kazanç", rr2 >= 1.8, `TP2'de maliyetler sonrası ${fN(rr2, 2)} R (alt sınır 1,8)`);
  G("Günlük limit ve pozisyon sayısı", true, `Bugün zarar ${fTRY(0)} · açık pozisyon 0/${CFG.maxPos}`);

  const riskFail = res.gates.find(g => !g.pass);
  if (riskFail) return finish(res, `${riskFail.name}: ${riskFail.detail}`);
  if (res.score < CFG.scoreMin) return finish(res, `Puan yetersiz (${res.score} < ${CFG.scoreMin})`);
  res.decision = res.side;
  res.reason = "Tüm kontroller geçti";
  return res;
}
function finish(res, reason) { res.decision = "İŞLEM YOK"; res.reason = reason; return res; }

async function runAnalysis(manual) {
  if (AN.running || document.hidden) return;
  if (dataState() !== "CANLI" || !S.rest.ok) { AN.err = "Piyasa verisi canlı değil; analiz yapılmadı (güvenli davranış)."; AN.nextAt = now() + 15e3; return; }
  AN.running = true; AN.err = null; render(true);
  try {
    const bt = await getJSON(EP.fut, "/fapi/v1/ticker/bookTicker");
    const book = new Map(bt.map(b => [b.symbol, { bid: +b.bidPrice, ask: +b.askPrice }]));
    const pf = prefilter(book);
    const pick = pf.ok.slice(0, MAX_ANALYZE);
    for (const s of WATCH) if (!pick.some(p => p.s === s)) { const r = pf.ok.find(p => p.s === s); if (r) pick.push(r); }
    AN.pre = { scanned: pf.ok.length + pf.elim.length, eliminated: pf.elim, skipped: Math.max(0, pf.ok.length - pick.length) };
    const out = [];
    for (let i = 0; i < pick.length; i += 4) {
      const part = await Promise.allSettled(pick.slice(i, i + 4).map(analyzeSymbol));
      part.forEach((p, j) => out.push(p.status === "fulfilled" ? p.value : { sym: pick[i + j].s, decision: "İŞLEM YOK", reason: "Analiz hatası: " + (p.reason?.message || p.reason), gates: [], soft: [], contra: [], at: now(), err: true }));
    }
    const rank = x => x.decision === "İŞLEM YOK" ? 0 : 1;
    out.sort((a, b) => rank(b) - rank(a) || (b.score || 0) - (a.score || 0));
    AN.results = out; AN.at = now();
    for (const x of out) {
      if (x.decision === "İŞLEM YOK") continue;
      const key = x.sym + x.decision, prevAt = AN.seen.get(key);
      if (!prevAt || now() - prevAt > SIGNAL_TTL) {
        addLog("info", `Yeni ${x.decision} sinyali: ${x.sym} (puan ${x.score})`);
        toast(`🚨 ${x.decision} sinyali: ${x.sym.replace("USDT", "")}/USDT`);
        try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch {}
      }
      AN.seen.set(key, now());
    }
  } catch (e) {
    AN.err = "Analiz yapılamadı: " + e.message;
    addLog("warn", AN.err);
  }
  AN.running = false; AN.nextAt = now() + 60e3;
  render(true);
}
let anTimer = null;
function scheduleAnalysis() {
  clearInterval(anTimer);
  anTimer = setInterval(() => { if (!AN.running && (!AN.nextAt || now() >= AN.nextAt)) runAnalysis(); }, 2000);
}

function signalState(x) {
  if (x.decision === "İŞLEM YOK" || !x.plan) return null;
  const p = x.plan, t = S.tickers.get(x.sym), px = t ? t.last : null;
  if (now() > p.validUntil) return ["ESKI", "Süresi doldu — yeni analizi bekle"];
  if (px == null || now() - t.ts > 10e3) return ["ESKI", "Canlı fiyat yok — işlem açma"];
  if (px < p.zoneLo - 0.5 * p.atr5 || px > p.zoneHi + 0.5 * p.atr5) return ["ESKI", `Fiyat (${fPx(px)}) giriş bölgesinden çıktı — eski fiyattan işlem açma`];
  if (x.decision === "LONG" ? px <= p.stop : px >= p.stop) return ["YOK", "Fiyat stop seviyesine ulaştı — sinyal iptal"];
  return ["CANLI", "Geçerli"];
}

  const ds = dataState(), r = S.rest, w = S.ws;
  const chip = (cls, l, v) => `<div class="chip ${cls}"><i></i><span>${l}</span><em>${v}</em></div>`;
  document.getElementById("chips").innerHTML = [
    chip(r.ok ? "ok" : "crit", "REST", r.ok ? `${r.lat} ms` : "hata"),
    chip(w.connected ? "ok" : "crit", "Akış", w.connected ? "bağlı" : "kopuk"),
    chip(ds === "CANLI" ? "ok" : ds === "GECIKMELI" ? "warn" : "crit", "Veri", { CANLI: "canlı", GECIKMELI: "gecikmeli", YOK: "yok" }[ds]),
    chip(AN.at && now() - AN.at < 150e3 ? "ok" : AN.at ? "warn" : "", "Son analiz", AN.running ? "çalışıyor" : AN.at ? fAgo(AN.at) : "bekliyor"),
    chip(AN.results.some(x => signalState(x)?.[0] === "CANLI") ? "ok" : "", "Sinyal", String(AN.results.filter(x => signalState(x)?.[0] === "CANLI").length)),
    chip("", "Haber", "bağlı değil"),
    chip("", "Açık poz.", "0"),
    chip("ok", "Günlük limit", `${fTRY(0)} / ${fTRY(CFG.startTry * CFG.dailyPct / 100)}`),
  ].join("");
  const lp = document.getElementById("livePill");
  lp.className = "pill " + (ds === "CANLI" ? "ok" : ds === "GECIKMELI" ? "wait" : "bad");
  lp.textContent = ds === "CANLI" ? "CANLI" : ds === "GECIKMELI" ? "GECİKMELİ" : "VERİ YOK";
  document.getElementById("warns").innerHTML = warnings().map(([l, t]) => `<div class="w ${l}">${esc(t)}</div>`).join("");
}

/* ---------- Yönlendirme ve render ---------- */
const TABS = { ozet: viewOzet, piyasa: viewPiyasa, sinyal: viewSinyal, ayar: viewAyar, daha: viewDaha };
const currentTab = () => { const h = location.hash.slice(1); return TABS[h] ? h : "ozet"; };
let lastTab = null;
function render(force) {
  renderTop();
  const tab = currentTab();
  const view = document.getElementById("view");
  // Form/girdi kullanılırken ekranı yeniden çizme (yazı kaybolmasın)
  const active = document.activeElement;
  const typing = active && view.contains(active) && /INPUT|SELECT|TEXTAREA/.test(active.tagName);
  if (!force && tab === lastTab && (tab === "ayar" || typing)) return;
  if (!force && tab === "daha" && dahaSub !== "sistem" && tab === lastTab) return;
  const scroll = window.scrollY;
  view.innerHTML = TABS[tab]();
  if (tab === lastTab) window.scrollTo(0, scroll);
  if (tab !== lastTab) { window.scrollTo(0, 0); if (tab === "piyasa") loadChart(); }
  lastTab = tab;
  document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
}

function toast(t) {
  const el = document.getElementById("toast");
  el.textContent = t; el.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 2200);
}

/* ---------- Etkileşim ---------- */
document.addEventListener("click", e => {
  const tr = e.target.closest("tr[data-sym]");
  if (tr) { MK.sel = tr.dataset.sym; MK.candles = []; render(true); loadChart(); window.scrollTo({ top: 0 }); return; }
  const iv = e.target.closest("button[data-iv]");
  if (iv) { MK.iv = iv.dataset.iv; MK.candles = []; render(true); loadChart(); return; }
  const sub = e.target.closest("[data-sub]");
  if (sub) { e.preventDefault(); dahaSub = sub.dataset.sub === "sistem" ? "sistem" : +sub.dataset.sub; render(true); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-back]")) { dahaSub = null; render(true); return; }
  if (e.target.id === "anNow") { runAnalysis(true); return; }
  if (e.target.id === "anRules") { AN.showRules = !AN.showRules; render(true); return; }
  const op = e.target.closest("[data-open]");
  if (op) { const s = op.dataset.open; AN.open.has(s) ? AN.open.delete(s) : AN.open.add(s); render(true); return; }
  if (e.target.id === "logClear") { S.log = []; store.set("log", []); render(true); return; }
  if (e.target.id === "cfgReset") { CFG = clampCfg({}); store.set("cfg", CFG); render(true); toast("Varsayılanlar yüklendi"); return; }
  const nav = e.target.closest(".nav a");
  if (nav && nav.dataset.tab === "daha") dahaSub = null;
});
document.addEventListener("input", e => {
  if (e.target.id === "mkQ") { MK.q = e.target.value; const pos = e.target.selectionStart; render(true); const i = document.getElementById("mkQ"); i.focus(); try { i.setSelectionRange(pos, pos); } catch {} }
});
document.addEventListener("change", e => {
  if (e.target.id === "mkV") { MK.minQv = +e.target.value; render(true); }
  if (e.target.id === "mkS") { MK.sort = e.target.value; render(true); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "cfgForm") return;
  e.preventDefault();
  const g = id => document.getElementById(id);
  const raw = { startTry: +g("startTry").value, targetTry: +g("targetTry").value, riskPct: +g("riskPct").value, dailyPct: +g("dailyPct").value, maxPos: +g("maxPos").value, minQv: +g("minQv").value, coingecko: g("coingecko").checked, maxSpreadBps: +g("maxSpreadBps").value, takerPct: +g("takerPct").value, maxLev: +g("maxLev").value, scoreMin: +g("scoreMin").value };
  const next = clampCfg(raw);
  const clamped = Object.keys(BOUNDS).some(k => next[k] !== raw[k]);
  AN.nextAt = now();
  const domWasOff = !CFG.coingecko && next.coingecko;
  CFG = next;
  const ok = store.set("cfg", CFG);
  addLog("info", "Risk ayarları güncellendi");
  if (domWasOff) pollDom();
  render(true);
  toast(!ok ? "Kaydedildi, ama bu tarayıcı kalıcı saklamaya izin vermiyor" : clamped ? "Kaydedildi; bazı değerler güvenli aralığa çekildi" : "Kaydedildi");
});
window.addEventListener("hashchange", () => render(true));

/* Telefon arka plana alınınca bağlantılar uyur; geri gelince hemen yenile. */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  addLog("info", "Uygulamaya dönüldü, veriler yenileniyor");
  if (!S.ws.connected || !S.ws.last || now() - S.ws.last > 10000) { wsBackoff = 1000; wsConnect(); }
  restCycle();
  AN.nextAt = now() + 5e3;
  if (currentTab() === "piyasa") loadChart();
});
window.addEventListener("online", () => { addLog("info", "İnternet bağlantısı geri geldi"); wsBackoff = 1000; wsConnect(); restCycle(); });
window.addEventListener("offline", () => addLog("crit", "İnternet bağlantısı kesildi"));

/* ---------- Başlat ---------- */
wsConnect();
restCycle();
render(true);
scheduleAnalysis();
setInterval(() => render(false), 1000);
</script>
</body>
